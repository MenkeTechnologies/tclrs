name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Per-target failures are tolerated on the musl variants so the downstream
    # publish + tap jobs still ship from whichever targets did build. The four
    # targets the formula's on_macos / on_linux blocks need are not tolerated.
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- macOS ---
          # Both mac targets build on macos-latest (arm64): nothing here links a
          # C library, so the x86_64 leg is a plain rustup cross-compile rather
          # than a macos-13 Intel runner (those queue for hours).
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # --- Linux glibc ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            # Cross-compiled from the x86_64 runner in a cross-rs container:
            # the native ubuntu-24.04-arm runners occasionally evict mid-build,
            # and this target must succeed for the formula's on_linux/on_arm
            # block to be emitted at all.
            use_cross: true
          # --- Linux musl static (portable across glibc/musl distros) ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            allow_failure: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            allow_failure: true
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: |
          # The prebuilt binary rather than `cargo install cross`, which costs
          # ~5 min of compile time on every cross-building runner.
          CROSS_VER="v0.2.5"
          curl -sSLf -o /tmp/cross.tar.gz \
            "https://github.com/cross-rs/cross/releases/download/${CROSS_VER}/cross-x86_64-unknown-linux-gnu.tar.gz"
          tar -C /tmp -xzf /tmp/cross.tar.gz
          sudo install -m 755 /tmp/cross /usr/local/bin/cross

      - uses: Swatinem/rust-cache@v2
        if: '!matrix.use_cross'

      - name: Build (native)
        if: '!matrix.use_cross'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin tclrs

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }} --bin tclrs

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          strip tclrs 2>/dev/null || true
          tar czf ../../../tclrs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz tclrs
          cd ../../..

      - uses: actions/upload-artifact@v6
        with:
          name: tclrs-${{ matrix.target }}
          path: tclrs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.tar.gz

  homebrew:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 sums
        id: sha
        shell: bash
        run: |
          for f in artifacts/*.tar.gz; do
            base=$(basename "$f")
            sum=$(sha256sum "$f" | awk '{print $1}')
            # tclrs-vX.Y.Z-aarch64-apple-darwin.tar.gz → aarch64_apple_darwin
            key=$(echo "$base" | perl -pe 's/tclrs-v[^-]*-//; s/\.tar\.gz//; s/-/_/g; s/\./_/g')
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@v6
        with:
          repository: MenkeTechnologies/homebrew-menketech
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          SHA_ARM_MACOS: ${{ steps.sha.outputs.aarch64_apple_darwin }}
          SHA_X86_MACOS: ${{ steps.sha.outputs.x86_64_apple_darwin }}
          SHA_X86_LINUX: ${{ steps.sha.outputs.x86_64_unknown_linux_gnu }}
          SHA_ARM_LINUX: ${{ steps.sha.outputs.aarch64_unknown_linux_gnu }}
          SHA_X86_LINUX_MUSL: ${{ steps.sha.outputs.x86_64_unknown_linux_musl }}
          SHA_ARM_LINUX_MUSL: ${{ steps.sha.outputs.aarch64_unknown_linux_musl }}
        run: |
          set -eu
          V="${VERSION#v}"
          BASE="https://github.com/MenkeTechnologies/tclrs/releases/download/v${V}"
          emit() { local guard="$1" arch="$2" sha="$3"; [ -n "$sha" ] || return 0; printf '    %s do\n      url "%s/tclrs-v%s-%s.tar.gz"\n      sha256 "%s"\n    end\n' "$guard" "$BASE" "$V" "$arch" "$sha"; }
          mac_blocks=$( { emit on_arm aarch64-apple-darwin "$SHA_ARM_MACOS"; emit on_intel x86_64-apple-darwin "$SHA_X86_MACOS"; } )
          linux_blocks=$( { emit on_intel x86_64-unknown-linux-gnu "$SHA_X86_LINUX"; emit on_arm aarch64-unknown-linux-gnu "$SHA_ARM_LINUX"; } )
          {
            printf 'class Tclrs < Formula\n'
            printf '  desc "Tcl compiled to fusevm bytecode — a parser and compiler, no bespoke VM or JIT"\n'
            printf '  homepage "https://github.com/MenkeTechnologies/tclrs"\n'
            printf '  license "MIT"\n'
            printf '  version "%s"\n\n' "$V"
            [ -n "$mac_blocks" ] && printf '  on_macos do\n%s\n  end\n\n' "$mac_blocks"
            [ -n "$linux_blocks" ] && printf '  on_linux do\n%s\n  end\n\n' "$linux_blocks"
            printf '  def install\n    bin.install "tclrs"\n  end\n\n'
            printf '  test do\n'
            printf '    assert_match "tclrs", shell_output("#{bin}/tclrs --version")\n'
            printf '    assert_equal "3", shell_output("#{bin}/tclrs -c \\x27puts [expr {1+2}]\\x27").strip\n'
            printf '  end\n'
            if [ -n "$SHA_X86_LINUX_MUSL" ] || [ -n "$SHA_ARM_LINUX_MUSL" ]; then
              printf '\n  # Static musl tarballs also published at this release:\n'
              [ -n "$SHA_X86_LINUX_MUSL" ] && printf '  #   tclrs-v%s-x86_64-unknown-linux-musl.tar.gz  sha256: %s\n' "$V" "$SHA_X86_LINUX_MUSL"
              [ -n "$SHA_ARM_LINUX_MUSL" ] && printf '  #   tclrs-v%s-aarch64-unknown-linux-musl.tar.gz  sha256: %s\n' "$V" "$SHA_ARM_LINUX_MUSL"
            fi
            printf 'end\n'
          } > tap/Formula/tclrs.rb

      - name: Push formula update
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tclrs.rb
          if git diff --cached --quiet; then
            echo "no changes — formula already up to date"
            exit 0
          fi
          git commit -m "tclrs: bump to ${{ github.ref_name }}"
          # The tap is shared by ~30 repos. When several releases land together
          # a bare push loses a non-fast-forward race, so rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "tap push rejected (concurrent update) — rebasing, attempt $attempt/5"
            git pull --rebase --autostash origin main || exit 1
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "tap push failed after 5 attempts" >&2
          exit 1
