name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build
        run: cargo build --verbose
      # No tclsh is installed on purpose. `tests/*_differential.rs` compare
      # against whatever `tclsh` is on PATH and tclrs targets 9.0.4 — the
      # release it is ported from — so a reference of another version reports
      # its own differences as tclrs failures (`info patchlevel` alone is one,
      # and apt's `tcl` is the 8.6 series). Each of those harnesses skips when
      # no tclsh is found, so this job covers everything else and the
      # differential suites are run locally against a matching 9.0.x.
      - name: Test
        run: cargo test --verbose
