[package]
name = "tclrs"
version = "0.4.1"
edition = "2021"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
description = "Tcl as a fusevm frontend: a parser and compiler to fusevm::Chunk, with no bespoke VM or JIT"
license = "MIT"
repository = "https://github.com/MenkeTechnologies/tclrs"
homepage = "https://menketechnologies.github.io/tclrs/"
documentation = "https://docs.rs/tclrs"
readme = "README.md"
keywords = ["tcl", "tclsh", "interpreter", "compiler", "fusevm"]
categories = ["command-line-utilities", "compilers"]
# Keep the published crate lean: ship `src/`, `man/`, `completions/`,
# README/LICENSE — nothing else. Everything below stays in git for
# local/CI use but is omitted from `cargo package` / the crates.io
# tarball. Mirrors strykelang's exclude set.
exclude = [
    "/.github/",
    "/tests/",
    "/conformance/",
    "/examples/",
    "/docs/",
    "/bench/",
    "/scripts/",
    "/fuzz/",
    "/BUGS.md",
]

# tclrs is a standalone crate, not a workspace member. An explicit empty
# `[workspace]` stops cargo walking up to the MenkeTechnologiesMeta parent.
[workspace]

[lib]
name = "tclrs"
path = "src/lib.rs"
# `staticlib` produces libtclrs.a so an AOT object (fusevm::aot) can be linked
# against the Tcl runtime — the `fusevm_aot_register_builtins` hook in
# `src/aot_runtime.rs` plus fusevm's AOT runtime — into a standalone executable.
crate-type = ["rlib", "staticlib"]

# The `tclsh`-compatible driver: a script file, `-c script`, or stdin — a REPL
# when stdin is a terminal — plus the ahead-of-time compiler, the disassembler
# and the tier report.
[[bin]]
name = "tclrs"
path = "src/main.rs"

# Writes docs/reference.html from the compiler's own tables. Offline: run it
# before publishing the docs, never as part of a script's run.
[[bin]]
name = "gen-docs"
path = "src/bin/gen_docs.rs"

# Hands the real Tk toolkit a stand-in interpreter and prints the ordered list
# of stub-table slots it calls. Needs a Tk dylib at run time, so it is behind
# the `tk` feature and is not part of a default build.
[[bin]]
name = "tk-probe"
path = "src/bin/tk_probe.rs"
required-features = ["tk"]

# The same, with the evaluator behind the table: `Tk_Init` against an
# interpreter that compiles and runs the scripts it is handed, and then a Tcl
# script calling a command Tk registered. Its argument, if any, is a script to
# evaluate once `Tk_Init` has returned.
[[bin]]
name = "tk-host"
path = "src/bin/tk_host.rs"
required-features = ["tk"]

[features]
# The Tk hosting instrument (`src/tk/`). Off by default: a machine with no Tk
# installed builds and tests exactly as before, and nothing outside `src/tk/`
# changes behaviour when it is on.
#
# `dep:cc` is the C compiler driver for `src/tk/trampoline.c`, which exists
# because stable rustc cannot define a C-variadic function (`error[E0658]`) and
# two of the stub slots are variadic with a payload. It is an optional
# *build*-dependency, so a default build neither downloads it nor runs a C
# compiler — see `build.rs`.
tk = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
# Execution and codegen live in fusevm; this crate only lowers to its ops.
#
# 0.17.0 is the floor. 0.15.0 gave the tracing tier a loop over VM *globals*,
# which is what a Tcl script's top-level loop is made of — before it, only a
# loop whose counter was a procedure's frame slot reached native code — and it
# is also where coroutines' halt-and-request mechanism and `VM::clear_halt`
# live, which the driver resumes a parked VM with. 0.17.0 adds the *sited*
# numeric hook, which carries the arithmetic's chunk identity and op index, so
# `incr` and `expr` report their own wording off the same `GetVar / LoadInt /
# Add` without either read stopping being a native op.
#
# `jit` is fusevm's three-tier Cranelift JIT (linear / block / tracing);
# `jit-disk-cache` adds the persistent on-disk cache of compiled native code
# (`~/.cache/fusevm-jit`, `FUSEVM_JIT_CACHE_DIR` to relocate or `=off` to
# disable) so codegen is not repaid on every process start; `aot` is the
# closed-world compiler that lowers a whole `Chunk` to a relocatable object
# (`src/aot.rs` here links one into a native executable).
fusevm = { version = "0.25.0", features = ["jit", "jit-disk-cache", "aot", "ffi"] }

# The interactive line editor: history, completion menu, emacs/vi keymaps and
# multi-line editing driven by the parser's own "still open" answer. Used by
# the binary only — a library user never enters the REPL — but a Cargo
# `[[bin]]` shares the package's dependency list, so it is declared here.
reedline = "0.49"
# Colors for the prompt's status bar. reedline's own re-export covers only the
# key types, not the style API.
nu-ansi-term = "0.50"
# Local time for the status bar clock and `TIOCGWINSZ` for its width. The
# alternative is a second copy of crossterm's terminal module; libc is already
# under reedline and gives both answers directly.
libc = "0.2"

# `tclrs --lsp` speaks the Language Server Protocol on stdio (`src/lsp.rs`).
# lsp-server is the framing and the two io threads; lsp-types is the schema, so
# a capability this crate does not answer is a compile error rather than a
# message an editor silently drops.
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `regexp` and `regsub`. Tcl matches with Henry Spencer's ARE engine, which
# backtracks; this one is a finite automaton and cannot express the two
# constructs that need backtracking — back-references and look-ahead — so
# `src/regexp.rs` refuses those by name rather than approximating them. The
# alternative was porting Spencer's matcher, which is the kind of code that is
# wrong in ways a test suite does not reach.
regex = "1.13.1"
# Tcl defines its character classes over Unicode general categories (the
# ALPHA_BITS / PUNCT_BITS / GRAPH_BITS unions in tclUtf.c), not over the derived
# properties Rust's std exposes, so `string is alpha` cannot be answered from
# `char::is_alphabetic`. This is the category table itself: data only, no
# dependencies of its own, and its answers were compared against tclsh across
# every code point before it was taken (see `src/cmd_string.rs`).
unicode-general-category = "1.1"

# Tcl 9's integers are arbitrary precision, and an `i64` overflow is a promotion
# rather than an error. `num-bigint` is pure Rust with one small dependency
# (`num-integer`/`num-traits`), so it builds wherever the crate already builds;
# `rug` is faster and binds GMP, which would put a C library between this crate
# and every target the release workflow cross-compiles for. The arithmetic here
# only reaches a bignum once an `i64` has already overflowed, so the constant
# factor never lands on a hot path — see `runtime::numeric`.
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
lto = true
codegen-units = 1
