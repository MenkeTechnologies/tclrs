[package]
name = "tclrs"
version = "0.1.0"
edition = "2021"
description = "Tcl as a fusevm frontend: a parser and compiler to fusevm::Chunk, with no bespoke VM or JIT"
license = "MIT"
repository = "https://github.com/MenkeTechnologies/tclrs"
homepage = "https://menketechnologies.github.io/tclrs/"
documentation = "https://docs.rs/tclrs"
readme = "README.md"
keywords = ["tcl", "tclsh", "interpreter", "compiler", "fusevm"]
categories = ["command-line-utilities", "compilers"]

# tclrs is a standalone crate, not a workspace member. An explicit empty
# `[workspace]` stops cargo walking up to the MenkeTechnologiesMeta parent.
[workspace]

[lib]
name = "tclrs"
path = "src/lib.rs"
# `staticlib` produces libtclrs.a so an AOT object (fusevm::aot) can be linked
# against the Tcl runtime — the `fusevm_aot_register_builtins` hook in
# `src/aot_runtime.rs` plus fusevm's AOT runtime — into a standalone executable.
crate-type = ["rlib", "staticlib"]

# The `tclsh`-compatible driver: a script file, `-c script`, or stdin — a REPL
# when stdin is a terminal — plus the ahead-of-time compiler, the disassembler
# and the tier report.
[[bin]]
name = "tclrs"
path = "src/main.rs"

[dependencies]
# Execution and codegen live in fusevm; this crate only lowers to its ops.
#
# 0.14.20 is the floor: coroutines are built on the halt-and-request mechanism
# `sched.rs` uses, and the driver resumes a parked VM with `VM::clear_halt`.
#
# `jit` is fusevm's three-tier Cranelift JIT (linear / block / tracing);
# `jit-disk-cache` adds the persistent on-disk cache of compiled native code
# (`~/.cache/fusevm-jit`, `FUSEVM_JIT_CACHE_DIR` to relocate or `=off` to
# disable) so codegen is not repaid on every process start; `aot` is the
# closed-world compiler that lowers a whole `Chunk` to a relocatable object
# (`src/aot.rs` here links one into a native executable).
fusevm = { version = "0.14.20", features = ["jit", "jit-disk-cache", "aot"] }

[profile.release]
lto = true
codegen-units = 1
