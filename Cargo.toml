[package]
name = "tclrs"
version = "0.1.0"
edition = "2021"
description = "Tcl as a fusevm frontend: a parser and compiler to fusevm::Chunk, with no bespoke VM or JIT"
license = "MIT"
repository = "https://github.com/MenkeTechnologies/tclrs"
homepage = "https://menketechnologies.github.io/tclrs/"
documentation = "https://docs.rs/tclrs"
readme = "README.md"
keywords = ["tcl", "tclsh", "interpreter", "compiler", "fusevm"]
categories = ["command-line-utilities", "compilers"]

# tclrs is a standalone crate, not a workspace member. An explicit empty
# `[workspace]` stops cargo walking up to the MenkeTechnologiesMeta parent.
[workspace]

[lib]
name = "tclrs"
path = "src/lib.rs"

# The `tclsh`-compatible driver: a script file, `-c script`, or stdin — a REPL
# when stdin is a terminal.
[[bin]]
name = "tclrs"
path = "src/main.rs"

[dependencies]
# Execution and codegen live in fusevm; this crate only lowers to its ops.
# The JIT features arrive in phase 6, with the benchmarks that justify them.
fusevm = "0.14.20"

[profile.release]
lto = true
codegen-units = 1
