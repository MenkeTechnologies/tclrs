[package]
name = "tclrs"
version = "0.3.0"
edition = "2021"
description = "Tcl as a fusevm frontend: a parser and compiler to fusevm::Chunk, with no bespoke VM or JIT"
license = "MIT"
repository = "https://github.com/MenkeTechnologies/tclrs"
homepage = "https://menketechnologies.github.io/tclrs/"
documentation = "https://docs.rs/tclrs"
readme = "README.md"
keywords = ["tcl", "tclsh", "interpreter", "compiler", "fusevm"]
categories = ["command-line-utilities", "compilers"]

# tclrs is a standalone crate, not a workspace member. An explicit empty
# `[workspace]` stops cargo walking up to the MenkeTechnologiesMeta parent.
[workspace]

[lib]
name = "tclrs"
path = "src/lib.rs"
# `staticlib` produces libtclrs.a so an AOT object (fusevm::aot) can be linked
# against the Tcl runtime — the `fusevm_aot_register_builtins` hook in
# `src/aot_runtime.rs` plus fusevm's AOT runtime — into a standalone executable.
crate-type = ["rlib", "staticlib"]

# The `tclsh`-compatible driver: a script file, `-c script`, or stdin — a REPL
# when stdin is a terminal — plus the ahead-of-time compiler, the disassembler
# and the tier report.
[[bin]]
name = "tclrs"
path = "src/main.rs"

# Writes docs/reference.html from the compiler's own tables. Offline: run it
# before publishing the docs, never as part of a script's run.
[[bin]]
name = "gen-docs"
path = "src/bin/gen_docs.rs"

[dependencies]
# Execution and codegen live in fusevm; this crate only lowers to its ops.
#
# 0.15.0 is the floor: the tracing tier compiles a loop over VM *globals* there,
# which is what a Tcl script's top-level loop is made of — before it, only a
# loop whose counter was a procedure's frame slot reached native code. It is
# also where coroutines' halt-and-request mechanism and `VM::clear_halt` live,
# which the driver resumes a parked VM with.
#
# `jit` is fusevm's three-tier Cranelift JIT (linear / block / tracing);
# `jit-disk-cache` adds the persistent on-disk cache of compiled native code
# (`~/.cache/fusevm-jit`, `FUSEVM_JIT_CACHE_DIR` to relocate or `=off` to
# disable) so codegen is not repaid on every process start; `aot` is the
# closed-world compiler that lowers a whole `Chunk` to a relocatable object
# (`src/aot.rs` here links one into a native executable).
fusevm = { version = "0.15.0", features = ["jit", "jit-disk-cache", "aot", "ffi"] }

# The interactive line editor: history, completion menu, emacs/vi keymaps and
# multi-line editing driven by the parser's own "still open" answer. Used by
# the binary only — a library user never enters the REPL — but a Cargo
# `[[bin]]` shares the package's dependency list, so it is declared here.
reedline = "0.49"
# Colors for the prompt's status bar. reedline's own re-export covers only the
# key types, not the style API.
nu-ansi-term = "0.50"
# Local time for the status bar clock and `TIOCGWINSZ` for its width. The
# alternative is a second copy of crossterm's terminal module; libc is already
# under reedline and gives both answers directly.
libc = "0.2"

# `tclrs --lsp` speaks the Language Server Protocol on stdio (`src/lsp.rs`).
# lsp-server is the framing and the two io threads; lsp-types is the schema, so
# a capability this crate does not answer is a compile error rather than a
# message an editor silently drops.
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
