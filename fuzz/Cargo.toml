[package]
name = "tclrs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tclrs]
path = ".."

# Each fuzz target must be a separate `[[bin]]` for cargo-fuzz to discover it.
[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compiler"
path = "fuzz_targets/compiler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expr"
path = "fuzz_targets/expr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "eval"
path = "fuzz_targets/eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vm"
path = "fuzz_targets/vm.rs"
test = false
doc = false
bench = false

# Standalone — not part of the main crate's build, so the fuzz dependencies stay
# off it.
[workspace]
